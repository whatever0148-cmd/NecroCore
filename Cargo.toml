[workspace]
resolver = "2"
members = [
    "crates/necro-core",
    "crates/necro-cobol-lifter",
    "crates/necro-rom-lifter",
    "crates/necro-prover",
    "crates/necro-kiro-bridge",
    "crates/necro-daemon",
    "apps/cryptledger",
    "apps/phantomarcade",
    "necro-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whatever0148-cmd/NecroCore"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "wat"] }
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"

[profile.release]
opt-level = 3
debug = false
